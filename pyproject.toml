[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name    = "presence"
version = "1.0.0"
description = "Convert Markdown files to PDF slideshows"
readme  = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "weasyprint>=60",
    "pyyaml>=6.0",
    "pygments>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock"]

[project.scripts]
# GTK4 GUI application
presence     = "presence.__main__:main"
# Headless CLI (no GTK required)
presence-cli = "presence.slides.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"presence" = ["presence-markdown.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
