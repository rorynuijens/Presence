[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name    = "presence"
version = "1.0.0"
description = "Convert Markdown files to PDF slideshows"
readme  = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    # Exclude the [woff] extra — it requires the brotli C extension which is
    # absent in the Flatpak sandbox.  Brotli is stubbed at runtime by
    # _pil_stub.py so WeasyPrint loads correctly without it.
    "weasyprint>=60",
    "fonttools>=4.0.0",          # pulled in by weasyprint; pin without extras
    "pyyaml>=6.0",
    "pygments>=2.15",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock"]

[project.scripts]
# GTK4 GUI application
presence     = "presence.__main__:main"
# Headless CLI (no GTK required)
presence-cli = "presence.slides.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"presence" = ["presence-markdown*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout, not whichever copy of Presence happens to be installed.
# Prepended to sys.path, so it wins over any editable install pointing
# somewhere else.
pythonpath = ["src"]
